services:
  - type: web
    name: price-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: CHECK_INTERVAL_HOURS
        value: "3"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
